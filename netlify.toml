# Site statique : aucune compilation, Netlify publie les fichiers tels quels.
# Les redirections de l'ancien site Squarespace sont dans _redirects.
[build]
  publish = "."

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
