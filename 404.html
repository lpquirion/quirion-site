<!doctype html>
<html lang="fr-CA"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable | Quirion Esthétique Mobile</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#141414;--tx:#F3F3F3;--mut:#a3a3a3;--ln:#2b2b2b;--red:#F31F1F;--rd:#B80F0F}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(55% 60% at 80% 20%,rgba(243,31,31,.18),transparent 70%),var(--bg);color:var(--tx);font:400 16px/1.6 Montserrat,system-ui,sans-serif;text-align:center}
.logo{width:150px;aspect-ratio:2.488;margin:0 auto 26px;background:var(--red);-webkit-mask:url(/images/logo.png) center/contain no-repeat;mask:url(/images/logo.png) center/contain no-repeat}
h1{font:400 clamp(3rem,10vw,6rem)/1 "Bebas Neue",Impact,sans-serif;letter-spacing:.02em}
h1 em{font-style:normal;color:var(--red)}
p{color:var(--mut);max-width:40ch;margin:14px auto 28px}
a{display:inline-block;margin:6px;padding:14px 26px;font-weight:500;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;border:1px solid var(--red);background:var(--red);color:#fff}
a.o{background:none;color:var(--tx);border-color:var(--ln)}
</style></head><body>
<main>
  <div class="logo" role="img" aria-label="Quirion Esthétique Mobile"></div>
  <h1>Page <em>introuvable</em></h1>
  <p>Cette page n'existe plus ou a changé d'adresse. Tous nos services sont maintenant sur notre nouveau site.</p>
  <a href="/">Retour à l'accueil</a><a class="o" href="/#contact">Obtenir ma soumission</a>
</main>
</body></html>
